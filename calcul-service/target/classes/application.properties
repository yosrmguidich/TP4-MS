spring.application.name=calcul-service
server.port=8081
# Adresse de l'annuaire Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
# Identifiant lisible de l'instance (defaut : nom-de-machine:calcul-service:8081)
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.prefer-ip-address=true
# Reglages pour le TP : battement de coeur toutes les 5 s (defaut : 30 s)
# et instance retiree apres 10 s sans nouvelle (defaut : 90 s)
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=10
# Swagger derriere la passerelle (partie E) : utiliser les en-tetes
# X-Forwarded-* pour connaitre l'adresse vue par le client
server.forward-headers-strategy=framework